name: Validate registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate module build configuration
        run: python3 scripts/validate-config.py
      - name: Validate published module index
        run: python3 scripts/validate-index.py
      - name: Compile Python tooling
        run: python3 -m py_compile scripts/*.py
